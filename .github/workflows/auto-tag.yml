name: Auto Tag & Publish on Release PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  validate:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      npm_dist_tag: ${{ steps.package.outputs.npm_dist_tag }}
      package_name: ${{ steps.package.outputs.package_name }}
      package_version: ${{ steps.package.outputs.package_version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Validate release title and branch
        id: release
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          export LC_ALL=C
          # Keep this grammar aligned with the product's SemVer contract. The
          # length bound prevents attacker-controlled event data from growing
          # without limit before it reaches a write-capable job.
          SEMVER_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER_PATTERN="(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${SEMVER_IDENTIFIER}(\\.${SEMVER_IDENTIFIER})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?"

          case "$PR_TITLE" in
            'Release v'*) VERSION=${PR_TITLE#'Release v'} ;;
            *) echo 'Release title must be exactly: Release v<semver>' >&2; exit 1 ;;
          esac

          if [ "${#VERSION}" -gt 128 ] || [[ ! "$VERSION" =~ ^${SEMVER_PATTERN}$ ]]; then
            echo 'Release title contains an invalid SemVer version.' >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if [ "$PR_HEAD_REF" != "release/${TAG}" ]; then
            echo 'Release branch must exactly match the validated tag.' >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            NPM_DIST_TAG=next
          else
            NPM_DIST_TAG=latest
          fi

          # These values remain job-local until package.json from the exact PR
          # head independently confirms the same release identity.
          {
            printf 'NPM_DIST_TAG=%s\n' "$NPM_DIST_TAG"
            printf 'RELEASE_TAG=%s\n' "$TAG"
            printf 'RELEASE_VERSION=%s\n' "$VERSION"
          } >> "$GITHUB_ENV"

      - name: Read package metadata from PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Bind validated release metadata
        id: package
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail closed before emitting any output. A taggable release is one
          # immutable tuple: event head, title/branch version, package version,
          # package name, tag, and npm dist-tag.
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'PR head commit is not a full lowercase SHA.' >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]; then
            echo 'Release tag and version are inconsistent.' >&2
            exit 1
          fi
          if { [[ "$RELEASE_VERSION" == *-* ]] && [ "$NPM_DIST_TAG" != next ]; } ||
             { [[ "$RELEASE_VERSION" != *-* ]] && [ "$NPM_DIST_TAG" != latest ]; }; then
            echo 'npm dist-tag does not match release stability.' >&2
            exit 1
          fi

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_NAME" != takt ] || [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo 'package.json does not match the validated release.' >&2
            exit 1
          fi

          {
            printf 'commit=%s\n' "$HEAD_SHA"
            printf 'npm_dist_tag=%s\n' "$NPM_DIST_TAG"
            printf 'package_name=%s\n' "$PACKAGE_NAME"
            printf 'package_version=%s\n' "$PACKAGE_VERSION"
            printf 'tag=%s\n' "$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ needs.validate.outputs.commit }}
      npm_dist_tag: ${{ needs.validate.outputs.npm_dist_tag }}
      package_name: ${{ needs.validate.outputs.package_name }}
      package_version: ${{ needs.validate.outputs.package_version }}
      tag: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag on PR head commit
        id: tag
        env:
          HEAD_SHA: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # `--` and a fully qualified refspec keep validated data out of Git's
          # option namespace even if the validation boundary changes later.
          git tag -- "$RELEASE_TAG" "$HEAD_SHA"
          git push -- origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.tag.outputs.npm_dist_tag }}
        run: npm publish --tag "$NPM_DIST_TAG"

      - name: Sync next tag on stable release
        if: needs.tag.outputs.npm_dist_tag == 'latest'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.tag.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.tag.outputs.package_version }}
        run: |
          for attempt in 1 2 3; do
            if npm dist-tag add "${PACKAGE_NAME}@${RELEASE_VERSION}" next; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to sync next tag after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify dist-tags
        env:
          EXPECTED_DIST_TAG: ${{ needs.tag.outputs.npm_dist_tag }}
          PACKAGE_NAME: ${{ needs.tag.outputs.package_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            LATEST=$(npm view "${PACKAGE_NAME}" dist-tags.latest)
            NEXT=$(npm view "${PACKAGE_NAME}" dist-tags.next || true)

            echo "Attempt ${attempt}: latest=${LATEST}, next=${NEXT}"

            if [ "$EXPECTED_DIST_TAG" != 'latest' ] || [ "$LATEST" = "$NEXT" ]; then
              echo "Dist-tags verified."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::warning::dist-tags not synced after 5 attempts (latest=${LATEST}, next=${NEXT}). Registry propagation may be delayed."
              exit 0
            fi
            sleep $((attempt * 10))
          done
