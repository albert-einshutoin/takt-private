# Curated from Suisui without credentials or machine-local paths.
subscription_only: true
provider: codex-cli
allowed_providers:
  - codex-cli
  - cursor-cli
  - opencode-cli
  - agy-cli
forbidden_providers:
  - codex
  - claude-sdk
provider_routing:
  personas:
    planner:
      provider: codex-cli
      model: suisui-planner
workflow_overrides:
  quality_gates:
    - npm test
    - swift test
minimal_output: false
